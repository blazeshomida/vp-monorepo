packages:
  - "packages/*"
  - "playgrounds/*"

catalogMode: prefer

catalog:
  "@changesets/changelog-github": ^0.7.0
  "@changesets/cli": ^2.31.0
  typescript: ^6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@1.2.0
  vite-plus: 1.2.0
  vitest: 5.0.4

peerDependencyRules:
  allowedVersions:
    vite: "*"
    vitest: "*"
  allowAny:
    - vite
    - vitest
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
